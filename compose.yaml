services:
  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      TASKFLOW_DB_HOST: db
      TASKFLOW_DB_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18.6
    environment:
      POSTGRES_DB: ${TASKFLOW_DB_NAME:-taskflow}
      POSTGRES_USER: ${TASKFLOW_DB_USER:-taskflow_user}
      POSTGRES_PASSWORD: ${TASKFLOW_DB_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
