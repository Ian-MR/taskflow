<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>{% block title %}TaskFlow{% endblock %}</title>
</head>
<body>
    <header>
        <h1>TaskFlow</h1>
        {% if user.is_authenticated %}
            <p>Olá, {{ user.username }}.</p>

            <form action="{% url 'logout' %}" method="post">
                {% csrf_token %}
                <button type="submit">Sair</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Entrar</a>
        {% endif %}
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>
</body>
</html>
