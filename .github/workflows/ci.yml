name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_DB: taskflow
          POSTGRES_USER: taskflow_user
          POSTGRES_PASSWORD: taskflow-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U taskflow_user -d taskflow"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TASKFLOW_DB_NAME: taskflow
      TASKFLOW_DB_USER: taskflow_user
      TASKFLOW_DB_PASSWORD: taskflow-password
      TASKFLOW_DB_HOST: 127.0.0.1
      TASKFLOW_DB_PORT: 5432
      TASKFLOW_SECRET_KEY: ci-only-secret-key

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Check formatting
        run: ruff format --check .

      - name: Check Django configurations
        run: python manage.py check

      - name: Check migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        run: python manage.py test
